server.port=8080

# Chave que o ESP32 envia no cabecalho X-API-Key (defina a variavel de ambiente API_KEY)
api.key=${API_KEY:troque-esta-chave}

# Banco H2 em arquivo (o historico sobrevive a reinicios)
spring.datasource.url=jdbc:h2:file:./data/totem;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
